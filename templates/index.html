<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="static/favicon.ico" />
</head>

<body>
    <div class="container mt-5 text-center card">
        <div class="card-header">
            <div class="d-flex justify-content-center align-items-center">
                <h1 class="text-center">ClimaExpress &#9925</h1>
                <label class="switch">
                    <input type="checkbox" class="invisible">
                    <span class="slider round"></span>
                </label>
            </div>
            <div>
                <div class="w-100">
                    <form id="form-1" class="d-flex w-100" onsubmit="fetchWeather(event)">
                        <input name="city" type="text" id="cityInput" class="form-control" placeholder="Introduce una ciudad">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div id="weatherResul" class="mt-4"></div>
            <div class="city-selection">
                <label for="cityDropdown"><strong>Ciudades populares:</strong></label>
                <hr>
                <select id="cityDropdown" class="form-select" onchange="selectCity()">
                    <option value="" disabled selected>Selecciona una ciudad</option>
                    <option value="Madrid">Madrid</option>
                    <option value="Barcelona">Barcelona</option>
                    <option value="Valencia">Valencia</option>
                    <option value="Sevilla">Sevilla</option>
                    <option value="Ciudad de Mexico">Ciudad de Mexico</option>
                </select>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
